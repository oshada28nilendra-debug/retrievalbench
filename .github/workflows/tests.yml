name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-lock.txt && python -m pip install -e . --no-deps
      - run: retrievalbench download
      - run: python -m pytest -q
      - run: npm ci && npx playwright install --with-deps chromium
      - name: Browser integration
        run: |
          retrievalbench serve > /tmp/retrievalbench.log 2>&1 &
          trap 'kill $!' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8766/ && break; sleep 1; done
          node tests/browser.cjs
